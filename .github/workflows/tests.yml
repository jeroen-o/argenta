name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rekenkern is gelijk aan index.html
        run: |
          python3 tools/export_engine.py
          git diff --exit-code argenta-engine.js
      - name: Tests rekenkern en HDN-adapter
        run: node tests/test.js
      - name: Robuustheidstest met willekeurige aanvragen
        run: node tests/fuzz.js
      - name: Browsertest
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node tests/e2e.js
